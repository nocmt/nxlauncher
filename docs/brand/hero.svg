<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">NxLauncher</title>
  <desc id="heroDesc">Your library. A new launch. An original red launch icon on a warm neutral backdrop.</desc>
  <defs>
    <linearGradient id="canvas" x1=".05" y1="0" x2=".95" y2="1"><stop stop-color="#fbf7f3"/><stop offset=".55" stop-color="#f3ece5"/><stop offset="1" stop-color="#e9ded5"/></linearGradient>
    <radialGradient id="halo" cx=".79" cy=".46" r=".6"><stop stop-color="#ff5b52" stop-opacity=".2"/><stop offset="1" stop-color="#ff5b52" stop-opacity="0"/></radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d8111f"/><stop offset="1" stop-color="#d8111f" stop-opacity="0"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#1d1013"/><stop offset="1" stop-color="#4a2027"/></linearGradient>
  </defs>
  <rect width="1600" height="640" rx="28" fill="url(#canvas)"/>
  <rect width="1600" height="640" rx="28" fill="url(#halo)"/>
  <rect x=".75" y=".75" width="1598.5" height="638.5" rx="27.25" fill="none" stroke="#7a3b38" stroke-opacity=".16" stroke-width="1.5"/>
  <!-- Quiet drafting traces echo the angle of the reference's soft diagonal light. -->
  <g fill="none" stroke-width="1">
    <path d="M788 410L1192 176Q1210 166 1228 176L1580 379" stroke="#d8b6a9" stroke-opacity=".55"/>
    <path d="M788 447L1192 213Q1210 203 1228 213L1580 416" stroke="#d8b6a9" stroke-opacity=".45"/>
    <path d="M788 484L1192 250Q1210 240 1228 250L1580 453" stroke="#d8b6a9" stroke-opacity=".35"/>
  </g>
  <path d="M104 144H158" stroke="#d8111f" stroke-width="3" stroke-linecap="round"/>
  <text x="180" y="150" fill="#8d5a55" font-family="'Avenir Next',Avenir,'Trebuchet MS',sans-serif" font-size="17" font-weight="600" letter-spacing="4">LIBRARY / BUILD / LAUNCH</text>
  <text x="99" y="302" fill="url(#word)" font-family="'Avenir Next',Avenir,'Trebuchet MS',sans-serif" font-size="105" font-weight="650" letter-spacing="-5">NxLauncher</text>
  <text x="106" y="371" fill="#5d4340" font-family="'Avenir Next',Avenir,'Trebuchet MS',sans-serif" font-size="31" font-weight="400" letter-spacing=".1">Your library. A new launch.</text>
  <path d="M106 432H604" stroke="url(#rule)" stroke-opacity=".45"/>
  <text x="106" y="489" fill="#7a5c56" font-family="'Avenir Next',Avenir,'Trebuchet MS',sans-serif" font-size="18" letter-spacing="1">A considered home for your games.</text>
  <svg x="915" y="19" width="602" height="602" viewBox="0 0 1024 1024" aria-labelledby="iconTitle iconDesc">

  <title id="iconTitle">NxLauncher — launch</title>
  <desc id="iconDesc">Original vector artwork. A soft vivid-red rounded tile with one rounded warm-white launch triangle. No third-party logo or game artwork.</desc>
  <defs>
    <linearGradient id="tile" x1=".1" y1="0" x2=".9" y2="1">
      <stop stop-color="#ff7f70"/><stop offset=".42" stop-color="#f32a34"/><stop offset=".78" stop-color="#e01322"/><stop offset="1" stop-color="#c40d1b"/>
    </linearGradient>
    <radialGradient id="wash" cx=".28" cy=".06" r=".9">
      <stop stop-color="#fff2ee" stop-opacity=".34"/><stop offset=".58" stop-color="#ffd6d1" stop-opacity=".07"/><stop offset="1" stop-color="#a80c16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff2ec" stop-opacity=".7"/><stop offset=".45" stop-color="#ffc9c3" stop-opacity=".12"/><stop offset="1" stop-color="#8e0a15" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="glyph" x1=".2" y1="0" x2=".75" y2="1">
      <stop stop-color="#ffffff"/><stop offset=".5" stop-color="#fff4f1"/><stop offset="1" stop-color="#ffd5cf"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".26"/><stop offset=".55" stop-color="#ffffff" stop-opacity=".05"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tileClip"><rect x="100" y="100" width="824" height="824" rx="200"/></clipPath>
  </defs>
  <!-- The 100px safe margin follows the optical size of macOS app tiles. -->
  <rect x="108" y="120" width="808" height="808" rx="194" fill="#5c020c" opacity=".13"/>
  <rect x="103" y="110" width="818" height="818" rx="198" fill="#5c020c" opacity=".2"/>
  <rect x="100" y="100" width="824" height="824" rx="200" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="200" fill="url(#wash)"/>
  <g clip-path="url(#tileClip)">
    <rect x="100" y="100" width="824" height="420" fill="url(#gloss)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="198.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- One simple, rounded geometry: the launch key. -->
  <ellipse cx="512" cy="668" rx="128" ry="17" fill="#6d030d" opacity=".15"/>
  <g id="launch-key">
    <path d="M400 370 L400 654 L630 512 Z" fill="#8e0a14" opacity=".16" transform="translate(1 10)" stroke="#8e0a14" stroke-width="86" stroke-linejoin="round"/>
    <path d="M400 370 L400 654 L630 512 Z" fill="url(#glyph)" stroke="url(#glyph)" stroke-width="86" stroke-linejoin="round"/>
  </g>

  </svg>
</svg>
