<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">NxLauncher — gamepad</title>
  <desc id="desc">Original vector artwork. A soft red gradient macOS tile with one warm-white gamepad silhouette: rounded body and grips, a plus pad, two round buttons and a short antenna. No third-party logo or game artwork.</desc>
  <defs>
    <linearGradient id="tile" x1=".15" y1="0" x2=".85" y2="1">
      <stop stop-color="#FF6E62"/><stop offset=".42" stop-color="#F5343C"/><stop offset=".78" stop-color="#E01824"/><stop offset="1" stop-color="#CB111D"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".05" r=".9">
      <stop stop-color="#FFF3EF" stop-opacity=".3"/><stop offset=".6" stop-color="#FFD9D4" stop-opacity=".06"/><stop offset="1" stop-color="#B00C18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF4F0" stop-opacity=".55"/><stop offset=".5" stop-color="#FFC9C3" stop-opacity=".1"/><stop offset="1" stop-color="#8E0A15" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="glyph" x1=".18" y1="0" x2=".72" y2="1">
      <stop stop-color="#FFFFFF"/><stop offset=".58" stop-color="#FFF5F2"/><stop offset="1" stop-color="#FFDCD4"/>
    </linearGradient>
    <mask id="padMask">
      <rect width="1024" height="1024" fill="#fff"/>
      <!-- D-pad: two crossing rounded bars -->
      <rect x="330" y="452" width="128" height="40" rx="20" fill="#000"/>
      <rect x="374" y="408" width="40" height="128" rx="20" fill="#000"/>
      <!-- two round action buttons, clear of the right grip -->
      <circle cx="588" cy="442" r="19" fill="#000"/>
      <circle cx="643" cy="442" r="19" fill="#000"/>
    </mask>
  </defs>
  <!-- The 100px safe margin follows the optical size of macOS app tiles. -->
  <rect x="108" y="120" width="808" height="808" rx="222" fill="#5C020C" opacity=".13"/>
  <rect x="103" y="110" width="818" height="818" rx="225" fill="#5C020C" opacity=".2"/>
  <rect x="100" y="100" width="824" height="824" rx="228" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="228" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="226.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <g id="pad-glyph" mask="url(#padMask)">
    <!-- Antenna: a short rounded stem with a small knob, above the body. -->
    <rect x="472" y="322" width="30" height="70" rx="15" fill="url(#glyph)"/>
    <circle cx="487" cy="322" r="27" fill="url(#glyph)"/>
    <!-- Body and grips. -->
    <rect x="240" y="356" width="544" height="204" rx="102" fill="url(#glyph)"/>
    <circle cx="304" cy="548" r="86" fill="url(#glyph)"/>
    <circle cx="720" cy="548" r="86" fill="url(#glyph)"/>
  </g>
</svg>
